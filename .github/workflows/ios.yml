name: iOS starter workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package CFPro
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build iOS device app
        env:
          scheme: CFPro
        run: |
          if [ "`ls -A | grep -i \.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -configuration Release -destination "generic/platform=iOS" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p dist
          app_path=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" | head -1)
          if [ -z "$app_path" ]; then
            echo "No device .app found under build/DerivedData/Build/Products/Release-iphoneos"
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$app_path" dist/Payload/
          (cd dist && zip -qry CFPro-unsigned.ipa Payload)
          rm -rf dist/Payload
      - name: Install ldid for TrollStore packaging
        run: brew install ldid
      - name: Package TrollStore IPA
        run: |
          app_path=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" | head -1)
          if [ -z "$app_path" ]; then
            echo "No device .app found under build/DerivedData/Build/Products/Release-iphoneos"
            exit 1
          fi
          rm -rf dist/Payload
          mkdir -p dist/Payload
          cp -R "$app_path" dist/Payload/

          main_app=$(find dist/Payload -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$main_app" ]; then
            echo "No app found under dist/Payload"
            exit 1
          fi

          find "$main_app" -type f \( -perm -111 -o -name "*.dylib" \) -print0 | while IFS= read -r -d '' file; do
            ldid -S "$file" || true
          done

          app_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$main_app/Info.plist")
          ldid -S"CFPro/CFPro.entitlements" "$main_app/$app_executable"

          for appex in "$main_app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            ext_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")
            ldid -S"VPNExtension/VPNExtension.entitlements" "$appex/$ext_executable"
          done

          (cd dist && zip -qry CFPro-trollstore.ipa Payload)
          rm -rf dist/Payload

          shasum -a 256 dist/CFPro-unsigned.ipa > dist/SHA256SUMS.txt
          shasum -a 256 dist/CFPro-trollstore.ipa >> dist/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: dist
      - name: Publish rolling main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI Latest
          prerelease: true
          make_latest: false
          files: |
            dist/CFPro-unsigned.ipa
            dist/CFPro-trollstore.ipa
            dist/SHA256SUMS.txt
